name: hibernate-orm-product
description: Hibernate ORM Product development, secure (no AI coding tools except Bob)
parent: tpl-dev-secure
repos:
  - host-source: ~/workspaces/product/hibernate-orm-product
    path: ~/hibernate-orm-product
  - host-source: ~/workspaces/product/hibernate-product-vex
    path: ~/hibernate-product-vex
workdir: ~/hibernate-orm-product
agent_note: |
  Repos cloned from the host were exported at build time: all local branches and
  tags are present, including unpushed history, but commits pushed to the host
  after the build are not. Check each repo's last commit date
  (`git -C ~/REPO log -1 --format=%ci`). If any repo's last commit is more than
  7 days old, stop and ask the user to confirm — they may need to rebuild.
