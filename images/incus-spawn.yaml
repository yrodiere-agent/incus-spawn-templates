name: incus-spawn
description: Recursive Development of Incus Spawn (isx)
parent: tpl-dev-vm
agent_note: |
  When authoring templates in ~/incus-spawn-templates, follow these conventions
  (see AGENTS.md "Template authoring conventions" for full details):

  Host-only repos (VPN/credential-gated, no container network access): stage with
  `host-resources` `mode: overlay` at `~/.host-repos/<name>`, then clone via
  `repos:` with `url: file:///home/agentuser/.host-repos/<name>`. This gives full
  isx repo integration instead of a raw mount. Such templates inherit from
  `tpl-dev-secure`. See `hibernate-orm-product.yaml`.

  Any host-only-repo template needs an `agent_note` telling the agent to check
  each host repo's last commit date and confirm with the user if any is >7 days old.

  Don't add `podman-custom` to templates inheriting `podman` from `tpl-dev-base` --
  they conflict on `DOCKER_HOST`.

  Build-test new templates with `isx build <template>` on real Incus -- YAML
  validation alone misses real failures.

  Branch from `upstream/main`, not the fork's own `main`, when working on this repo.
packages:
  - copr-cli
  - lxc-devel
  - openssl
tools:
  - firewalld
  - incus
repos:
  - url: https://github.com/Sanne/incus-spawn/
    path: ~/incus-spawn
    prime: >-
      set -e;
      echo '==> [1/5] Building and installing isx (install.sh)...';
      ~/incus-spawn/install.sh;
      echo '==> [2/5] Initializing isx (isx init)...';
      isx init </dev/null;
      echo '==> [3/5] Verifying incusd is running...';
      if ! systemctl is-active --quiet incus; then
        echo 'ERROR: incusd is not running after isx init';
        journalctl --no-pager -u incus -u incus-startup --since '10 min ago' | tail -80;
        sudo coredumpctl list --no-pager 2>/dev/null || true;
        exit 1;
      fi;
      echo '==> [4/5] Configuring placeholder credentials...';
      sed -i
      -e 's/^claude: {}/claude:\n  apiKey: "placeholder"/'
      -e 's/token: ""/token: "placeholder"/'
      -e 's|^searchPaths: \[\]|searchPaths:\n- ~/incus-spawn-templates|'
      -e '$a\host-ca:\n  propagate: true'
      ~/.config/incus-spawn/config.yaml;
      echo '==> [5/5] Installing isx proxy (isx proxy install)...';
      isx proxy install </dev/null;
      echo '==> All priming steps completed successfully'
  - url: https://github.com/yrodiere/incus-spawn-templates/
    path: ~/incus-spawn-templates
  - url: https://github.com/yrodiere/incus-spawn-images/
    path: ~/incus-spawn-images
