name: commonhaus-infra
description: Commonhaus Foundation infrastructure, secure (no AI coding tools except Bob)
parent: tpl-dev-secure
repos:
  - host-source: ~/workspaces/infra/project-hibernate
    path: ~/project-hibernate
  - host-source: ~/workspaces/infra/commonhaus-automation
    path: ~/commonhaus-automation
  - host-source: ~/workspaces/infra/commonhaus-handbook
    path: ~/commonhaus-handbook
  - host-source: ~/workspaces/infra/foundation-internal
    path: ~/foundation-internal
  - host-source: ~/workspaces/infra/project-commonhaus
    path: ~/project-commonhaus
  - host-source: ~/workspaces/infra/sponsors
    path: ~/sponsors
agent_note: |
  Repos cloned from the host were exported at build time: all local branches and
  tags are present, including unpushed history, but commits pushed to the host
  after the build are not. Check each repo's last commit date
  (`git -C ~/REPO log -1 --format=%ci`). If any repo's last commit is more than
  7 days old, stop and ask the user to confirm — they may need to rebuild.
