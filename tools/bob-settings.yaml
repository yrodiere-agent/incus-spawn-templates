name: bob-settings
description: Bob Shell session settings for long-running container environments
requires:
  - bob

files:
  - path: /etc/bobshell/settings.json
    content: |
      {
        "general": {
          "disableAutoUpdate": true,
          "disableUpdateNag": true,
          "checkpointing": {
            "enabled": true
          }
        },
        "model": {
          "maxSessionTurns": -1,
          "chatCompression": {
            "contextPercentageThreshold": 0.6
          }
        }
      }
