name: podman-custom
description: Rootless podman with compose, Testcontainers support, and permissive short image names

packages:
  - podman
  - podman-docker
  - fuse-overlayfs
  - systemd-pam
  - dbus-broker
  - podman-compose

files:
  - path: /etc/containers/registries.conf.d/10-short-names.conf
    content: |
      # Resolve short image names (e.g. postgres:18) to docker.io without prompting.
      short-name-mode = "permissive"
      unqualified-search-registries = ["docker.io"]

run:
  # Enable lingering so the user session (and its socket-activated services)
  # starts at boot without requiring a login.
  - mkdir -p /var/lib/systemd/linger && touch /var/lib/systemd/linger/agentuser
  # Enable rootless podman socket for agentuser.
  - |
    mkdir -p /home/agentuser/.config/systemd/user/sockets.target.wants &&
    ln -sf /usr/lib/systemd/user/podman.socket \
      /home/agentuser/.config/systemd/user/sockets.target.wants/podman.socket &&
    chown -R agentuser:agentuser /home/agentuser/.config

env:
  - name: DOCKER_HOST
    value: unix:///run/user/1000/podman/podman.sock
  - name: TESTCONTAINERS_RYUK_CONTAINER_PRIVILEGED
    value: "true"

verify: podman --version && podman-compose --version
