name: develocity-mcp
description: Develocity MCP server for build scans and test history
proxy:
  config-namespace: develocity
  configuration:
    commonhaus-access-key:
      config-path: "commonhausAccessKey"
      description: "Develocity access key for develocity.commonhaus.dev"
      secret: true
      help:
        - "The Develocity MCP server is a read-only query interface —"
        - "it never publishes scans or writes cache data, regardless"
        - "of what the underlying access key could do via the REST API."
        - ""
        - "Your account needs the accessBuildDataViaApiAndMcp permission"
        - "(included in the Developer role)."
        - "For cross-project analytics, also: "
        - "  readAccessAllBuildDataWithOrWithoutAssociatedProject"
        - ""
        - "Generate a key at My settings > Access keys > Generate."
        - ""
        - "Press Enter to skip if you have no access to this instance."
    quarkus-access-key:
      config-path: "quarkusAccessKey"
      description: "Develocity access key for ge.quarkus.io"
      secret: true
      help:
        - "Same as above — any key with accessBuildDataViaApiAndMcp"
        - "works. Press Enter to skip if you have no access to this"
        - "instance."
  auth:
    - domains:
        - develocity.commonhaus.dev
      type: bearer
      token: "${commonhaus-access-key}"
    - domains:
        - ge.quarkus.io
      type: bearer
      token: "${quarkus-access-key}"
run_as_user:
  - '/home/agentuser/.local/bin/claude mcp add -t http -s user develocity-commonhaus https://develocity.commonhaus.dev/mcp -H "Authorization: Bearer placeholder"'
  - '/home/agentuser/.local/bin/claude mcp add -t http -s user develocity-quarkus https://ge.quarkus.io/mcp -H "Authorization: Bearer placeholder"'
